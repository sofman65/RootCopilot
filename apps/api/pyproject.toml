[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.128.8",
    "langchain-anthropic>=0.3.22",
    "langchain-openai>=0.3.35",
    "langgraph>=0.6.11",
    "langsmith>=0.4.37",
    "openai>=2.38.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.1",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0",
    "uvicorn>=0.39.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "pytest>=8.0",
    "httpx>=0.27",
    "mypy>=1.19.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true

